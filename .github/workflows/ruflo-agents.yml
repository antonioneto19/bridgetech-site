name: Ruflo CI - Bridge Site

# Pipeline de qualidade do site institucional BRIDGE.
# - O DEPLOY de producao e feito pela Vercel (integracao Git), independente deste workflow.
# - Este workflow valida o site (sempre) e roda os agentes Ruflo (se os secrets existirem).
# - Projetado para NUNCA falhar por falta de chaves: passos opcionais sao tolerantes a erro.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 11 * * 1-5'   # dias uteis as 08:00 BRT (11:00 UTC)
  workflow_dispatch:
    inputs:
      task:
        description: 'Tarefa para o agente Ruflo'
        required: false
        default: 'full-audit'

concurrency:
  group: ruflo-bridge-site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 1) Validacao deterministica do site - sempre roda, sem dependencia de chaves.
  validate-site:
    name: ✅ Validacao do Site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar paginas HTML essenciais
        run: |
          echo "=== Verificando paginas HTML ==="
          fail=0
          for f in index.html servicos.html sobre.html cases.html contato.html privacidade.html 404.html; do
            if [ -f "$f" ]; then
              echo "OK  $f"
            else
              echo "ERRO  $f ausente"; fail=1
            fi
          done
          for f in robots.txt sitemap.xml vercel.json assets/bridge.css assets/bridge.js assets/contato.js; do
            if [ -f "$f" ]; then echo "OK  $f"; else echo "ERRO  $f ausente"; fail=1; fi
          done
          exit $fail

      - name: Validar JSON do vercel.json
        run: |
          echo "=== Validando vercel.json ==="
          python3 -c "import json,sys; json.load(open('vercel.json')); print('vercel.json: JSON valido')"

      - name: Conferir headers de seguranca no vercel.json
        run: |
          echo "=== Conferindo headers de seguranca ==="
          fail=0
          for h in "Content-Security-Policy" "Strict-Transport-Security" "X-Frame-Options" "X-Content-Type-Options"; do
            if grep -q "$h" vercel.json; then echo "OK  $h"; else echo "ERRO  $h ausente"; fail=1; fi
          done
          exit $fail

      - name: Verificar assets referenciados no HTML
        run: |
          echo "=== Verificando assets referenciados (src/href locais) ==="
          fail=0
          # Extrai caminhos de assets/ referenciados nos HTML e confere se o arquivo existe.
          refs=$(grep -rhoE '(src|href)="(assets/[^"?#]+)"' *.html | sed -E 's/.*"(assets\/[^"?#]+)".*/\1/' | sort -u)
          for r in $refs; do
            if [ -f "$r" ]; then echo "OK  $r"; else echo "ERRO  referencia quebrada: $r"; fail=1; fi
          done
          exit $fail

  # 2) Agentes Ruflo - so executam de fato se os secrets existirem; caso contrario, pulam sem erro.
  ruflo-agents:
    name: 🤖 Ruflo Agents (opcional)
    runs-on: ubuntu-latest
    needs: validate-site
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # SEM cache: 'npm' de proposito — o site e estatico e nao tem package-lock.json.

      - name: Verificar disponibilidade dos secrets
        id: secrets
        env:
          RUFLO_API_KEY: ${{ secrets.RUFLO_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Secrets presentes: agentes Ruflo serao executados."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY ausente: pulando agentes Ruflo (sem erro)."
          fi

      - name: Ruflo Init
        if: steps.secrets.outputs.ready == 'true'
        continue-on-error: true
        env:
          RUFLO_API_KEY: ${{ secrets.RUFLO_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "=== Ruflo Init — Bridge Site ==="
          npx -y ruflo@latest --version || true
          npx -y ruflo@latest init --project bridgetech-site --topology hierarchical || echo "ruflo init finalizado"

      - name: Agente Reviewer
        if: steps.secrets.outputs.ready == 'true'
        continue-on-error: true
        env:
          RUFLO_API_KEY: ${{ secrets.RUFLO_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "=== Reviewer Agent ==="
          npx -y ruflo@latest agent run reviewer \
            --task "Revisar mudancas: qualidade, acessibilidade (WCAG 2.1 AA) e padroes da marca Bridge" \
            || echo "reviewer: execucao tolerante a erro concluida"

      - name: Agente Security
        if: steps.secrets.outputs.ready == 'true'
        continue-on-error: true
        env:
          RUFLO_API_KEY: ${{ secrets.RUFLO_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "=== Security Agent — LGPD + HTTP Headers ==="
          npx -y ruflo@latest agent run security \
            --task "Auditar headers HTTP (CSP, HSTS, X-Frame-Options), conformidade LGPD e vetores XSS" \
            || echo "security: execucao tolerante a erro concluida"

      - name: Resumo
        if: always()
        run: |
          if [ "${{ steps.secrets.outputs.ready }}" = "true" ]; then
            echo "Agentes Ruflo executados (modo tolerante a erro)."
          else
            echo "Agentes Ruflo pulados — configure o secret ANTHROPIC_API_KEY (e RUFLO_API_KEY) para ativar."
          fi
